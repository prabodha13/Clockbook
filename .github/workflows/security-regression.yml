name: ClockBook security regression

on:
  push:
  pull_request:
  schedule:
    - cron: "17 3 * * 1"

permissions:
  contents: read

jobs:
  regression-and-security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install source-test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-ci.txt
      - name: Compile Python
        run: python -m compileall -q backend tests ops alembic
      - name: Run ClockBook regression and invariant tests
        run: PYTHONPATH=backend pytest -q tests
      - name: Validate Alembic migration graph
        run: |
          alembic heads
          alembic history
      - name: Python production dependency audit
        shell: bash
        run: |
          if [ -f backend/requirements.txt ]; then
            pip-audit -r backend/requirements.txt
          elif [ -f backend/pyproject.toml ]; then
            pip-audit backend
          else
            echo "No Python production dependency manifest found; dependency security is not complete."
            exit 1
          fi
      - name: Node production dependency audit
        shell: bash
        run: |
          if [ -f frontend/package-lock.json ]; then
            cd frontend
            npm ci
            npm audit --audit-level=high
          elif [ -f frontend/npm-shrinkwrap.json ]; then
            cd frontend
            npm ci
            npm audit --audit-level=high
          elif [ -f frontend/package.json ]; then
            echo "package.json exists without a lockfile; commit package-lock.json for reproducible security scanning."
            exit 1
          else
            echo "No Node package manifest in this repository; skipping Node audit."
          fi
